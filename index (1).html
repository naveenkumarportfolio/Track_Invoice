<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>InvoiceTrack</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="4" y="3" width="16" height="18" rx="3"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>
      <span>InvoiceTrack</span>
    </div>
    <nav aria-label="Main navigation" id="nav">
      <button data-page="dashboard"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></svg>Dashboard</button>
      <button data-page="invoices"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M6 3h9l4 4v14H6z"/><path d="M9 12h7M9 16h7"/></svg>All Invoices</button>
      <button data-page="payments"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="6" width="18" height="12" rx="2"/><circle cx="12" cy="12" r="2.5"/></svg>Payments</button>
      <button data-page="reports"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-8M22 20H2"/></svg>Reports</button>
      <button data-page="settings"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/></svg>Business Profile</button>
    </nav>
    <p class="side-note">Data is saved only in this browser.</p>
  </aside>
  <div class="main">
    <header class="topbar">
      <button class="icon-btn menu-btn" id="menu-btn" aria-label="Toggle navigation" aria-expanded="false" aria-controls="sidebar">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
      <div class="titles"><h1 id="page-title">Dashboard</h1><p id="page-desc"></p></div>
      <input id="search" type="search" placeholder="Search invoice no. or customer" aria-label="Search invoices by number or customer">
      <button class="btn primary" id="new-btn">New Invoice</button>
      <div class="profile"><span class="avatar" id="avatar" aria-hidden="true"></span><span id="biz-name"></span></div>
    </header>
    <main id="view" tabindex="-1"></main>
  </div>
</div>

<dialog id="modal" aria-labelledby="modal-title">
  <div class="modal-head"><h2 id="modal-title"></h2><button class="icon-btn" id="modal-close" aria-label="Close dialog">&times;</button></div>
  <div id="modal-body"></div>
</dialog>
<dialog id="confirm" aria-labelledby="confirm-title">
  <h2 id="confirm-title">Please confirm</h2>
  <p id="confirm-msg"></p>
  <div class="actions"><button class="btn" id="confirm-no">Cancel</button><button class="btn danger" id="confirm-yes">Confirm</button></div>
</dialog>
<div id="toast" role="status" aria-live="polite"></div>
<div id="print-area"></div>
<script src="script.js"></script>
</body>
</html>
